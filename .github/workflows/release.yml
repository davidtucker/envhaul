name: Release

# Builds, signs and publishes a release with GoReleaser. It runs:
#   - from release-please.yml after merging a release PR (stable releases),
#   - when a maintainer pushes a pre-release tag such as v0.2.0-rc.1,
#   - manually (Actions -> Release -> Run workflow) to retry a release.
#
# Pushes of stable tags (vX.Y.Z) are deliberately ignored: release-please
# creates those, and its workflow already calls this one. Reacting to the
# tag as well would publish the same release twice.

on:
  push:
    tags: ["v*-*"]
  workflow_call:
    inputs:
      tag:
        description: Tag to release
        required: true
        type: string
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to (re)publish, e.g. v0.1.0
        required: true
        type: string

# Not read-all: as a reusable workflow, every scope requested here must be
# granted by the caller (release-please.yml).
permissions:
  contents: read

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  goreleaser:
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the release and upload assets
      packages: write # push the image to ghcr.io
      id-token: write # keyless signing and attestations
      attestations: write # build provenance
    steps:
      - uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag || github.ref }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - uses: anchore/sbom-action/download-syft@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        id: goreleaser
        with:
          distribution: goreleaser
          version: v2.19.0
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          SCOOP_BUCKET_TOKEN: ${{ secrets.SCOOP_BUCKET_TOKEN }}
      - name: Attest build provenance
        id: attest
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-checksums: dist/checksums.txt
      # The attestation is also stored by GitHub (`gh attestation verify`);
      # attaching it to the release lets anyone verify it offline, and is
      # what OpenSSF Scorecard looks for.
      - name: Attach provenance to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.tag || github.ref_name }}
          BUNDLE: ${{ steps.attest.outputs.bundle-path }}
        run: |
          provenance="envhaul_${TAG#v}.intoto.jsonl"
          cp "$BUNDLE" "$provenance"
          gh release upload "$TAG" "$provenance" --clobber --repo "$GITHUB_REPOSITORY"
      # Ask the Go module proxy for the new version so `go install ...@latest`
      # sees it right away and pkg.go.dev indexes it (it learns about versions
      # from the proxy). The release is already published by this point, so a
      # proxy hiccup is reported without failing the release.
      - name: Publish the version to proxy.golang.org and pkg.go.dev
        continue-on-error: true
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
          GOPROXY: https://proxy.golang.org
          GOFLAGS: -mod=mod
        run: |
          module=$(go list -m)
          for attempt in 1 2 3 4 5 6; do
            if go list -m "$module@$TAG"; then
              echo "Requested $module@$TAG; pkg.go.dev: https://pkg.go.dev/$module@$TAG"
              exit 0
            fi
            echo "Attempt $attempt failed; retrying in 20s"
            sleep 20
          done
          echo "::warning::proxy.golang.org did not return $module@$TAG; run 'GOPROXY=https://proxy.golang.org go list -m $module@$TAG' later"
          exit 1
