name: Release Please

# Maintains a release PR from Conventional Commits on main. Merging that PR
# tags the release and creates the GitHub Release; the release job then
# builds and attaches the artifacts.
#
# release-please acts as the "envhaul release" GitHub App when it is
# configured (variable RELEASE_PLEASE_APP_CLIENT_ID and secret
# RELEASE_PLEASE_APP_PRIVATE_KEY). PRs opened with the default GITHUB_TOKEN
# don't run CI without a maintainer approving each run, and don't trigger
# pull_request_target checks at all, so the required checks would never
# report. Without the App, it falls back to GITHUB_TOKEN.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions: read-all

jobs:
  release-please:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - name: Get a GitHub App token
        id: app-token
        if: vars.RELEASE_PLEASE_APP_CLIENT_ID != ''
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.RELEASE_PLEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_PLEASE_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write
          permission-issues: write
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        id: release
        with:
          token: ${{ steps.app-token.outputs.token || secrets.GITHUB_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  # The tag release-please creates may also trigger release.yml's tag-push
  # trigger (it does when the App token created it). release.yml ignores
  # pushes of stable tags, so this call is the only path that publishes a
  # stable release.
  release:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    permissions:
      contents: write
      packages: write
      id-token: write
      attestations: write
    uses: ./.github/workflows/release.yml
    with:
      tag: ${{ needs.release-please.outputs.tag_name }}
    secrets: inherit
