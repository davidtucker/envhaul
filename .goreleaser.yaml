# yaml-language-server: $schema=https://goreleaser.com/static/schema.json
# Release pipeline. Validate with `make release-check`; build locally with
# `make snapshot`. Real releases run in .github/workflows/release.yml.
version: 2

project_name: envhaul

before:
  hooks:
    - ./scripts/completions.sh
    - ./scripts/manpages.sh

builds:
  - id: envhaul
    main: ./cmd/envhaul
    binary: envhaul
    env:
      - CGO_ENABLED=0
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]
    flags:
      - -trimpath
    ldflags:
      - -s -w
      - -X github.com/davidtucker/envhaul/internal/version.Version={{ .Version }}
      - -X github.com/davidtucker/envhaul/internal/version.Commit={{ .FullCommit }}
      - -X github.com/davidtucker/envhaul/internal/version.Date={{ .CommitDate }}
    # Reproducible builds: timestamps come from the commit, not the clock.
    mod_timestamp: "{{ .CommitTimestamp }}"

archives:
  - id: envhaul
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files:
      - LICENSE
      - NOTICE
      - README.md
      - CHANGELOG.md
      - completions/*
      - manpages/*

checksum:
  name_template: checksums.txt

# SPDX SBOM for every archive (requires syft).
sboms:
  - artifacts: archive

# Keyless signing of the checksums file via GitHub OIDC (requires cosign).
# Verify with:
#   cosign verify-blob --bundle checksums.txt.sigstore.json \
#     --certificate-identity-regexp '^https://github.com/davidtucker/envhaul/' \
#     --certificate-oidc-issuer https://token.actions.githubusercontent.com checksums.txt
signs:
  - cmd: cosign
    artifacts: checksum
    signature: "${artifact}.sigstore.json"
    args:
      - sign-blob
      - --bundle=${signature}
      - ${artifact}
      - --yes

dockers_v2:
  - id: envhaul
    ids: [envhaul]
    dockerfile: Dockerfile
    images:
      - ghcr.io/davidtucker/envhaul
    tags:
      - "{{ .Version }}"
      - "{{ if not .Prerelease }}v{{ .Major }}{{ end }}"
      - "{{ if not .Prerelease }}latest{{ end }}"
    platforms:
      - linux/amd64
      - linux/arm64
    labels:
      org.opencontainers.image.title: envhaul
      org.opencontainers.image.description: Haul config and secrets from AWS into .env files.
      org.opencontainers.image.source: https://github.com/davidtucker/envhaul
      org.opencontainers.image.url: https://davidtucker.github.io/envhaul
      org.opencontainers.image.licenses: Apache-2.0
      org.opencontainers.image.version: "{{ .Version }}"
      org.opencontainers.image.revision: "{{ .FullCommit }}"
      org.opencontainers.image.created: "{{ .CommitDate }}"

docker_signs:
  - cmd: cosign
    artifacts: manifests
    args:
      - sign
      - ${artifact}@${digest}
      - --yes

nfpms:
  - id: packages
    ids: [envhaul]
    package_name: envhaul
    file_name_template: "{{ .ConventionalFileName }}"
    vendor: envhaul contributors
    homepage: https://davidtucker.github.io/envhaul
    maintainer: David Tucker <davidtucker@users.noreply.github.com>
    description: Haul config and secrets from AWS into .env files.
    license: Apache-2.0
    formats: [deb, rpm, apk]
    bindir: /usr/bin
    section: utils
    contents:
      - src: ./completions/envhaul.bash
        dst: /usr/share/bash-completion/completions/envhaul
        file_info: { mode: 0644 }
      - src: ./completions/envhaul.zsh
        dst: /usr/share/zsh/vendor-completions/_envhaul
        file_info: { mode: 0644 }
      - src: ./completions/envhaul.fish
        dst: /usr/share/fish/vendor_completions.d/envhaul.fish
        file_info: { mode: 0644 }
      - src: ./manpages/*.1.gz
        dst: /usr/share/man/man1/
        file_info: { mode: 0644 }
      - src: ./LICENSE
        dst: /usr/share/doc/envhaul/LICENSE
        file_info: { mode: 0644 }

homebrew_casks:
  - name: envhaul
    ids: [envhaul]
    repository:
      owner: davidtucker
      name: homebrew-tap
      # GoReleaser only accepts a bare {{ .Env.NAME }} here (no functions).
      # The release workflow always sets it, empty when there's no token.
      token: "{{ .Env.HOMEBREW_TAP_TOKEN }}"
    directory: Casks
    homepage: https://davidtucker.github.io/envhaul
    description: Haul config and secrets from AWS into .env files
    license: Apache-2.0
    commit_author:
      name: '{{ if isEnvSet "PACKAGING_COMMIT_NAME" }}{{ .Env.PACKAGING_COMMIT_NAME }}{{ else }}envhaul-release-bot{{ end }}'
      email: '{{ if isEnvSet "PACKAGING_COMMIT_EMAIL" }}{{ .Env.PACKAGING_COMMIT_EMAIL }}{{ else }}davidtucker@users.noreply.github.com{{ end }}'
    commit_msg_template: "envhaul {{ .Tag }}"
    binaries: [envhaul]
    manpages:
      - manpages/envhaul.1.gz
    completions:
      bash: completions/envhaul.bash
      zsh: completions/envhaul.zsh
      fish: completions/envhaul.fish
    # Skipped when HOMEBREW_TAP_TOKEN isn't configured; pre-releases are
    # never published to the tap.
    skip_upload: '{{ if isEnvSet "HOMEBREW_TAP_TOKEN" }}auto{{ else }}true{{ end }}'
    hooks:
      post:
        # The binaries are signed via cosign, not Apple notarization; drop
        # the quarantine flag Homebrew adds on download.
        install_steps: |
          if OS.mac?
            system_command "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "#{staged_path}/envhaul"]
          end

scoops:
  - name: envhaul
    ids: [envhaul]
    repository:
      owner: davidtucker
      name: scoop-bucket
      # GoReleaser only accepts a bare {{ .Env.NAME }} here (no functions).
      # The release workflow always sets it, empty when there's no token.
      token: "{{ .Env.SCOOP_BUCKET_TOKEN }}"
    homepage: https://davidtucker.github.io/envhaul
    description: Haul config and secrets from AWS into .env files.
    license: Apache-2.0
    commit_author:
      name: '{{ if isEnvSet "PACKAGING_COMMIT_NAME" }}{{ .Env.PACKAGING_COMMIT_NAME }}{{ else }}envhaul-release-bot{{ end }}'
      email: '{{ if isEnvSet "PACKAGING_COMMIT_EMAIL" }}{{ .Env.PACKAGING_COMMIT_EMAIL }}{{ else }}davidtucker@users.noreply.github.com{{ end }}'
    commit_msg_template: "envhaul {{ .Tag }}"
    # Skipped when SCOOP_BUCKET_TOKEN isn't configured; pre-releases are
    # never published to the bucket.
    skip_upload: '{{ if isEnvSet "SCOOP_BUCKET_TOKEN" }}auto{{ else }}true{{ end }}'

release:
  github:
    owner: davidtucker
    name: envhaul
  # release-please creates the GitHub Release with the changelog; GoReleaser
  # only attaches artifacts. For manually tagged release candidates it
  # creates the release itself.
  mode: keep-existing
  # Lets a failed release be retried (Actions -> Release -> Run workflow).
  replace_existing_artifacts: true
  prerelease: auto
  footer: |
    ## Verify this release

    ```sh
    cosign verify-blob --bundle checksums.txt.sigstore.json \
      --certificate-identity-regexp '^https://github.com/davidtucker/envhaul/' \
      --certificate-oidc-issuer https://token.actions.githubusercontent.com checksums.txt
    sha256sum --ignore-missing -c checksums.txt
    gh attestation verify envhaul_{{ .Version }}_linux_amd64.tar.gz --repo davidtucker/envhaul
    ```

changelog:
  use: github-native
