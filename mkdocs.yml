site_name: envhaul
site_description: Haul config and secrets from your vaults into .env files.
site_url: https://davidtucker.github.io/envhaul/
repo_url: https://github.com/davidtucker/envhaul
repo_name: davidtucker/envhaul
edit_uri: edit/main/docs/
copyright: Copyright &copy; 2026 the envhaul contributors. Apache-2.0.

theme:
  name: material
  logo: assets/brand/mark.svg
  favicon: assets/brand/icon.svg
  font:
    text: Inter
    code: JetBrains Mono
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  features:
    - content.code.copy
    - content.action.edit
    - navigation.sections
    - navigation.top
    - navigation.footer
    - search.highlight
    - search.suggest
    - toc.follow

extra_css:
  - stylesheets/brand.css

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/davidtucker/envhaul

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets:
      base_path: ["."]
      check_paths: true
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true

nav:
  - Home: index.md
  - Getting started: getting-started.md
  - Guide:
      - Configuration: config.md
      - References and pipes: references.md
      - AWS profiles and permissions: aws.md
      - Commands: commands.md
      - Using envhaul in CI: ci.md
  - Sources:
      - Overview: sources/index.md
      - SSM Parameter Store: sources/ssm.md
      - Secrets Manager: sources/secrets-manager.md
      - Vault and OpenBao: sources/vault.md
      - 1Password: sources/1password.md
      - Google Cloud Secret Manager: sources/gcp.md
      - Azure Key Vault: sources/azure-key-vault.md
  - Security: security.md
  - CLI reference: reference/cli/envhaul.md
  - FAQ: faq.md
  - Roadmap: roadmap.md
  - Contributing:
      - Adding a source: contributing/providers.md
      - Maintainer guide: maintainers.md
