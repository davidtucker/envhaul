# AWS emulator for integration tests: `make emulator-up`, then
# `make test-integration`. moto serves SSM and Secrets Manager on one port.
# CI starts the same file, so this is the only place the version is pinned
# (Dependabot keeps it up to date).
services:
  moto:
    image: motoserver/moto:5.2.3
    ports:
      - "127.0.0.1:5000:5000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/moto-api/')"]
      interval: 2s
      timeout: 3s
      retries: 30
